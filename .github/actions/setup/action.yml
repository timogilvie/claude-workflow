name: Setup test environment
description: Node.js, system test tools, git identity, and dependencies shared by all CI test jobs.

inputs:
  packages:
    description: Space-separated apt packages to install.
    required: false
    default: jq shellcheck tmux

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22'
        cache: npm

    - name: Install system test tools
      shell: bash
      run: |
        # Composite-action steps do not support timeout-minutes
        # (actions/runner#1979), so bound each network-bound command with
        # coreutils timeout. Setup completes in 23-143s when healthy; jobs that
        # wedge here otherwise run to the 6h job ceiling and bill the whole time.
        run_bounded() {
          # Capture via `|| rc=$?`: inside `if ! cmd`, $? is the status of the
          # negation (always 0), which would silently swallow the failure.
          local rc=0
          timeout "${SETUP_STEP_TIMEOUT_SECONDS}" "$@" || rc=$?
          if [ "$rc" -ne 0 ]; then
            if [ "$rc" -eq 124 ]; then
              echo "::error::'$*' exceeded ${SETUP_STEP_TIMEOUT_SECONDS}s in CI setup; failing fast so the job can be retried."
            fi
            exit "$rc"
          fi
        }
        run_bounded sudo apt-get update
        run_bounded sudo apt-get install -y ${{ inputs.packages }}
      env:
        SETUP_STEP_TIMEOUT_SECONDS: '300'

    - name: Configure git for tests
      shell: bash
      run: |
        git config --global user.email "ci@wavemill.test"
        git config --global user.name "Wavemill CI"

    - name: Install dependencies
      shell: bash
      run: |
        rc=0
        timeout "${SETUP_STEP_TIMEOUT_SECONDS}" npm install --ignore-scripts || rc=$?
        if [ "$rc" -ne 0 ]; then
          if [ "$rc" -eq 124 ]; then
            echo "::error::npm install exceeded ${SETUP_STEP_TIMEOUT_SECONDS}s in CI setup; failing fast so the job can be retried."
          fi
          exit "$rc"
        fi
      env:
        SETUP_STEP_TIMEOUT_SECONDS: '300'
